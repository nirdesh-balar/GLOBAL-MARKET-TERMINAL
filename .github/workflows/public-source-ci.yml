name: Source safety and regressions
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'nirdesh-balar/GLOBAL-MARKET-TERMINAL'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          # Cached on macos-15-arm64 and published as a Darwin arm64 release asset.
          python-version: '3.11.9'
          architecture: arm64
      - run: npm ci
      - name: Install the locked Electron runtime
        run: npm exec --no -- install-electron
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements-lock.txt
      - run: node scripts/download-test-directory.mjs
      - run: backend/.venv/bin/python -m pytest backend/tests -q
        env:
          IMT_OFFLINE: '1'
      - run: npm run build
      - run: npm run test:platform
      - run: npm run test:package:config
      - run: node scripts/version-consistency-test.mjs
      - run: npm run test:macos -- --math
      - run: caffeinate -di npm run test:macos -- --ui
      # Candidate binaries and raw test output remain on the ephemeral runner.
      # No artifact upload is permitted until a separate evidence policy is reviewed.
