name: Source safety and regressions
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'nirdesh-balar/GLOBAL-MARKET-TERMINAL'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.11.13
      - run: npm ci
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -r backend/requirements-lock.txt
      - run: node scripts/download-test-directory.mjs
      - run: backend/.venv/bin/python -m pytest backend/tests -q
      - run: npm run build
      - run: node scripts/verify-windows.mjs --math
      - run: node scripts/release-ui.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-evidence
          path: test-results/
          retention-days: 7
