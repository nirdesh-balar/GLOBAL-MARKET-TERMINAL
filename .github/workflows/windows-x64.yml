name: Windows v1.0.0 candidate (manual review required)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed 40-character commit SHA containing this unified source
        required: true
        type: string
      portable:
        description: Also build portable candidate (requires separate manual acceptance)
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  windows-x64:
    if: github.repository == 'nirdesh-balar/GLOBAL-MARKET-TERMINAL'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      GMT_BUILD_PORTABLE: ${{ inputs.portable && '1' || '0' }}
      PYTHONUTF8: '1'
    steps:
      - name: Validate explicit revision
        shell: pwsh
        run: |
          if ($env:SOURCE_REF -notmatch '^[a-fA-F0-9]{40}$') {throw 'Select an exact reviewed commit SHA'}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - name: Assert checked out revision
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_REF) {throw 'Source revision mismatch'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.11.13
          architecture: x64
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Install pinned Windows Python dependencies
        run: node scripts/setup-windows.mjs
      - name: Prepare ignored official test directory
        run: node scripts/download-test-directory.mjs
      - name: Full Python regression suite (actual Windows execution)
        run: backend/.venv/Scripts/python.exe -m pytest backend/tests -q --junitxml=test-results/windows-python.xml
      - name: Typecheck and native Windows package
        run: node scripts/package-windows.mjs
      - name: Shared numerical and Electron regressions on Windows
        run: node scripts/verify-windows.mjs
      - name: Windows F11 and native window API checks
        run: node scripts/windows-window-controls-ui.mjs
      - name: Controlled logical viewport and scale checks
        run: node scripts/windows-scaling-ui.mjs
      - name: Install, packaged real providers, quit/restart and uninstall probe
        run: node scripts/windows-installer-smoke.mjs --ci-disposable
      - name: Final fingerprints and Windows candidate report
        if: always()
        run: node scripts/windows-ci-report.mjs
      - name: Upload candidate artifacts and evidence (never publish a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GMT-v1.0.0-windows-x64-${{ inputs.source_ref }}
          path: |
            release-v1.0.0-global-market-terminal-windows/
            test-results/
          if-no-files-found: error
          retention-days: 30
