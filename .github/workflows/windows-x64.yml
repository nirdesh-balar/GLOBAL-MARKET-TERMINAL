name: Windows evidence-only validation (manual review required)
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact reviewed 40-character commit SHA containing this unified source
        required: true
        type: string
      portable:
        description: Also build portable candidate (requires separate manual acceptance)
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  windows-x64:
    if: github.repository == 'nirdesh-balar/GLOBAL-MARKET-TERMINAL' && github.actor == 'nirdesh-balar' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SOURCE_REF: ${{ inputs.source_ref }}
      GMT_BUILD_PORTABLE: ${{ inputs.portable && '1' || '0' }}
      PYTHONUTF8: '1'
    steps:
      - id: validate
        name: Validate explicit revision
        shell: pwsh
        run: |
          if ($env:SOURCE_REF -notmatch '^[a-fA-F0-9]{40}$') {throw 'Select an exact reviewed commit SHA'}
      - id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - id: revision
        name: Assert checked out revision
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_REF) {throw 'Source revision mismatch'}
      - id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
      - id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13.16
          check-latest: false
          architecture: x64
      - id: npm
        name: Install locked JavaScript dependencies
        run: node scripts/windows-ci-run.mjs npm cmd.exe /d /s /c "npm ci"
      - id: dependencies
        name: Install pinned Windows Python dependencies
        run: node scripts/windows-ci-run.mjs dependencies node scripts/setup-windows.mjs
      - id: directory
        name: Prepare ignored official test directory
        run: node scripts/windows-ci-run.mjs directory node scripts/download-test-directory.mjs
      - id: privacy_tests
        name: Evidence privacy guard tests (built-ins only)
        run: node scripts/windows-ci-run.mjs privacy_tests node scripts/windows-ci-preflight-run.mjs privacy_tests
      - id: reporting_tests
        name: Failure-reporting and passive observer tests
        run: node scripts/windows-ci-run.mjs reporting_tests node scripts/windows-ci-preflight-run.mjs reporting_tests
      - id: python_tests
        name: Full Python regression suite (actual Windows execution)
        run: node scripts/windows-ci-run.mjs python_tests backend/.venv/Scripts/python.exe scripts/windows_pytest_diagnostics.py backend/tests -q --junitxml=test-results/windows-python.xml
      - id: package
        name: Typecheck and native Windows package
        run: node scripts/windows-ci-run.mjs package node scripts/package-windows.mjs
      - id: regressions
        name: Shared numerical and Electron regressions on Windows
        run: node scripts/windows-ci-run.mjs regressions node scripts/verify-windows.mjs
      - id: controls
        name: Windows F11 and native window API checks
        run: node scripts/windows-ci-run.mjs controls node scripts/windows-window-controls-ui.mjs
      - id: scaling
        name: Controlled logical viewport and scale checks
        run: node scripts/windows-ci-run.mjs scaling node scripts/windows-scaling-ui.mjs
      - id: installer
        name: Install, packaged real providers, quit/restart and uninstall probe
        run: node scripts/windows-ci-run.mjs installer node scripts/windows-installer-smoke.mjs --ci-disposable
      - id: private_report
        name: Runner-local fingerprints and candidate report
        if: always()
        env:
          GMT_CI_STEPS: ${{ toJSON(steps) }}
        run: node scripts/windows-ci-run.mjs private_report node scripts/windows-ci-report.mjs
      - id: public_evidence
        name: Regenerate sanitized evidence only (no package copying)
        if: always()
        env:
          GMT_PRIVATE_REPORT_OUTCOME: ${{ steps.private_report.outcome }}
        run: node scripts/windows-ci-public.mjs prepare
      - id: evidence_guard
        name: Revalidate exact public evidence allowlist
        if: always() && steps.public_evidence.outcome == 'success'
        run: node scripts/windows-ci-public.mjs verify
      - name: Upload reviewed text evidence only (no binaries or raw logs)
        if: always() && steps.public_evidence.outcome == 'success' && steps.evidence_guard.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: GMT-windows-evidence-only-${{ inputs.source_ref }}
          path: |
            ci-evidence-public/WINDOWS-VERIFICATION.json
            ci-evidence-public/WINDOWS-VERIFICATION.md
            ci-evidence-public/INSTALLER-SHA256.txt
            ci-evidence-public/EVIDENCE-SHA256SUMS.txt
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
